<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131926"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ffb020" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff7a18" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="fishGrad" x1="20" y1="24" x2="46" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#ffb020"/>
      <stop offset="100%" stop-color="#ff7a18"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="16" y1="28" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Obsidian tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="1.75"/>

  <!-- Subtle inner lens ring -->
  <circle cx="32" cy="34" r="22.5" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Fishbowl top lip -->
  <path d="M22 15.2C24.8 14.1 28.2 13.5 32 13.5C35.8 13.5 39.2 14.1 42 15.2" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>

  <!-- Outer glass lens / fishbowl sphere -->
  <path d="M21.5 16.5C15.8 20.1 12 26.6 12 34C12 45.05 20.95 54 32 54C43.05 54 52 45.05 52 34C52 26.6 48.2 20.1 42.5 16.5" stroke="#e2e8f0" stroke-opacity="0.82" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Water fill / meniscus inside bowl -->
  <path d="M14.3 31.2C18.8 29.4 24.4 33.4 32 31.4C39.6 29.4 45.2 33 49.7 31.2C48.4 42.9 41 51.6 32 51.6C23 51.6 15.6 42.9 14.3 31.2Z" fill="url(#waterGrad)"/>
  <path d="M15.2 31.2C19.5 29.5 24.6 33.2 32 31.3C39.4 29.4 44.8 32.8 48.8 31.2" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Stylized geometric goldfish / aperture curve -->
  <path d="M25.5 36.8C29.8 31.5 37.2 31.8 42.2 36.4C37.5 41.2 30.2 42.2 25.5 36.8Z" fill="url(#fishGrad)"/>
  <path d="M26.5 36.8L19.8 32.2C20.9 35.1 20.9 38.5 19.8 41.4L26.5 36.8Z" fill="url(#fishGrad)"/>
  <circle cx="37.4" cy="35.6" r="1.35" fill="#090b10"/>

  <!-- Optic lens specular glint -->
  <path d="M18.2 22.8C16.9 24.6 16 26.7 15.6 28.9" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="20.6" cy="20.5" r="1.25" fill="#22d3ee"/>
</svg>
